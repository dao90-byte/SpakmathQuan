<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toán Vui Cùng Khỉ Con</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Baloo 2','Nunito','Comic Sans MS',system-ui,sans-serif;background:linear-gradient(#b9ecf2,#fff1b8);min-height:100vh;color:#3b2f63;user-select:none;-webkit-user-select:none}
#app{max-width:720px;margin:auto;padding:12px;text-align:center}
.btn{border:0;border-radius:22px;padding:10px 18px;font:inherit;font-size:22px;font-weight:800;color:#fff;background:#ff7043;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer;margin:4px}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:focus-visible,.card:focus-visible{outline:4px solid #3b2f63}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{border-radius:26px;padding:14px;color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer}
.card b{font-size:50px;display:block;line-height:1.2}
.bar{height:20px;background:#fff;border-radius:10px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffca28,#ff7043);transition:width .6s}
.mk{animation:bn 1.6s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-8px) rotate(-3deg)}}
.sh{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ov{position:fixed;inset:0;background:rgba(40,30,80,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.ov>div{background:#fff;border-radius:30px;padding:22px;max-width:92%;text-align:center}
.cf{position:fixed;top:-50px;animation:fall 2.4s linear forwards;z-index:99;pointer-events:none;font-style:normal}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.row{display:flex;align-items:center;justify-content:space-between}
.say{font-size:22px;font-weight:800;margin:8px 4px}
.bg{display:inline-block;width:30%;margin:5px;font-size:16px;font-weight:800}
.bg b{display:block;font-size:52px}
.lock{filter:grayscale(1);opacity:.4}
@media(prefers-reduced-motion:reduce){.mk,.sh{animation:none}}
</style></head><body><div id="app"></div>
<button id="errb" class="btn" aria-label="Bỏ qua bài bị lỗi" style="display:none;position:fixed;right:10px;bottom:10px;z-index:40;margin:0;padding:8px 14px;font-size:16px;background:#e53935" onclick="skipLv()">LỖI</button>
<script>
const app=document.getElementById('app'),rand=n=>Math.floor(Math.random()*n),shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S;try{S=JSON.parse(localStorage.sm1)}catch(e){}
S=S||{st:{},bd:[]};S.ch=S.ch||{};S.rm=S.rm||[];S.sn=S.sn||{};S.sk=S.sk||{};
const save=()=>{try{localStorage.sm1=JSON.stringify(S)}catch(e){}};
let lc=null;const view=h=>{const y=window.pageYOffset||0;app.innerHTML=h;window.scrollTo(0,cur===lc?y:0);if(cur!==lc)showErr(0);lc=cur};
/* ===== Âm thanh & giọng đọc ===== */
let mute=false,AC,V,IN='';
function tone(seq){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const SND={ok:[[660,.12],[880,.2]],no:[[260,.2,'square'],[200,.3,'square']],pop:[[520,.07]],win:[[523,.15],[659,.15],[784,.15],[1047,.45]]};
const snd=k=>{tone(SND[k]);chkErr()};
function pick(){const v=speechSynthesis.getVoices().filter(x=>/^vi/i.test(x.lang));V=v.find(x=>/HoaiMy|Linh|Female|Google/i.test(x.name))||v[0]}
if('speechSynthesis'in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(mute||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';if(V)u.voice=V;u.pitch=1.4;u.rate=.85;speechSynthesis.speak(u)}
const speak=t=>{IN=t;if(!S.sn[cur.g.id])say(t)};
function confetti(){for(let i=0;i<32;i++){const e=document.createElement('i');e.textContent=['⭐','🎉','🎈','✨','🍬'][i%5];e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.7}s;font-size:${20+Math.random()*22}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),3300)}}
/* ===== Dữ liệu chung ===== */
const MK=w=>`<svg class="mk" width="${w}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="18" cy="42" r="14" fill="#e8344e"/><circle cx="82" cy="42" r="14" fill="#e8344e"/><circle cx="18" cy="42" r="8" fill="#ffd9d0"/><circle cx="82" cy="42" r="8" fill="#ffd9d0"/><circle cx="50" cy="52" r="36" fill="#e8344e"/><ellipse cx="50" cy="62" rx="26" ry="20" fill="#ffe4dc"/><circle cx="38" cy="46" r="6" fill="#3b1a1a"/><circle cx="62" cy="46" r="6" fill="#3b1a1a"/><circle cx="40" cy="44" r="2" fill="#fff"/><circle cx="64" cy="44" r="2" fill="#fff"/><ellipse cx="50" cy="58" rx="5" ry="3.5" fill="#6b2a2a"/><path d="M36 68q14 14 28 0z" fill="#b3202f"/><path d="M42 18q-4-14 6-14M58 18q4-14-6-14" stroke="#3b1a1a" stroke-width="3" fill="none"/></svg>`;
const G=[{id:'ang',n:'Góc vuông',ic:'📐',L:15,c:'#ff8a65'},{id:'t',n:'Xếp hình T',ic:'🧩',L:6,c:'#26b5c9'},{id:'t2',n:'T nâng cao',ic:'🧱',L:10,c:'#3f7fd6'},{id:'tan',n:'Tangram',ic:'🔷',L:5,c:'#ab5fc2'},{id:'tan2',n:'Tangram nâng cao',ic:'🦊',L:12,c:'#e0589a'},{id:'sdk',n:'Sudoku 4x4',ic:'🍎',L:15,c:'#5aae5e'},{id:'xh2',n:'Xếp hình siêu cấp',ic:'🏰',L:80,c:'#d35400'},{id:'sdk2',n:'Sudoku 6x6',ic:'🔢',L:20,c:'#00897b'},{id:'pt',n:'Tìm quy luật',ic:'🔁',L:20,c:'#e0589a'},{id:'sy',n:'Đối xứng gương',ic:'🪞',L:20,c:'#5c6bc0'},{id:'mm',n:'Trí nhớ',ic:'🃏',L:20,c:'#f08c00'},{id:'mz',n:'Mê cung',ic:'🌀',L:20,c:'#2a9d8f'},{id:'ord',n:'Xếp thứ tự',ic:'📊',L:30,c:'#3f7fd6'},{id:'odd',n:'Tìm hình lạ',ic:'👀',L:30,c:'#2a9d8f'},{id:'sim',n:'Nhớ dãy màu',ic:'🎹',L:30,c:'#e0a100'}];
const CT=[{id:'hh',n:'Hình học',ic:'📐',c:'#ef7b4d',g:['xh2','ang','sy','xh2','t2','xh2','tan2']},{id:'tn',n:'Trí nhớ',ic:'🃏',c:'#e0a100',g:['mm','sim']},{id:'lg',n:'Logic',ic:'🧩',c:'#8e5bd1',g:['pt','sdk','mz','sdk2']},{id:'qs',n:'Quan sát',ic:'👀',c:'#2a9d8f',g:['odd']},{id:'kg',n:'Đo lường',ic:'📊',c:'#3f7fd6',g:['ord']}];
const rm=k=>S.rm[k]||0,ok_=k=>rm(k)>0||!!S.sk[k],sh=n=>n>20?'20+':n,CI=['🐣','🐥','🐰','🐻','🐼','🦊','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦉','🐺','🦄','🐝','🦋','🐞','🐢','🐙','🐬','🐳','🦈','🐘','🦒','🐲'],tot=()=>S.rm.reduce((a,b)=>a+(b||0),0)+Object.keys(S.ch).length,done=()=>S.rm.filter(x=>x>0).length,cdone=()=>{let n=0;for(let r=0;r<30;r++)if(CT.every((c,j)=>rm(r*CT.length+j)>0))n++;return n},cat=c=>STEPS.reduce((a,t,k)=>t.c==c?a+rm(k):a,0),catn=c=>STEPS.filter((t,k)=>t.c==c&&rm(k)>0).length;
const RK=[[0,'Khỉ con tập sự 🐵'],[15,'Thám hiểm nhí 🧭'],[50,'Nhà toán học nhí 🎓'],[100,'Siêu nhân toán 🦸'],[220,'Thiên tài toán 🧠']];
const rank_=()=>[...RK].reverse().find(r=>tot()>=r[0])[1];
const BD=[['b1','🌱','Bước đầu tiên',()=>done()>=1],['b2','⭐','10 ngôi sao',()=>tot()>=10],['b3','🏆','Ngôi sao lớn',()=>tot()>=30],['bh','🚀','Siêu sao',()=>tot()>=100],['b4','💎','Ba sao tuyệt đối',()=>S.rm.filter(x=>x==3).length>=5],['k1','🥉','Xong chặng 1',()=>cdone()>=1],['k5','🥈','Xong 5 chặng',()=>cdone()>=5],['k10','🥇','Xong 10 chặng',()=>cdone()>=10],['k30','👑','Vua toán học',()=>cdone()>=30],['bx','🌈','Thử thách ngoài đời',()=>Object.keys(S.ch).length>=4],...CT.map(c=>['t'+c.id,c.ic,'Giỏi '+c.n,()=>catn(c.id)>=15])];
let cur={};
/* ===== Màn hình chính ===== */
function splash(){view(`<div style="margin-top:8vh">${MK(190)}<h1 style="font-size:40px;margin:6px">Toán Vui Cùng Khỉ Con</h1><button class="btn" style="font-size:36px;padding:16px 40px;background:#43a047" onclick="home(1)">▶️ Chơi nào!</button></div>`)}
function home(){lc=null;const k0=STEPS.findIndex((t,k)=>!ok_(k));
view(`<div class="row" style="justify-content:center;gap:10px">${MK(84)}<div style="text-align:left"><div style="font-size:26px;font-weight:800">Toán Vui Cùng Khỉ Con</div><div>${rank_()}</div><div style="font-size:26px">⭐ ${sh(tot())}</div></div></div><div class="bar"><i style="width:${done()/STEPS.length*100}%"></i></div>
<p><button class="btn" onclick="bdg()">🏅 Huy hiệu</button><button class="btn" style="background:#7e57c2" onclick="rank()">🏆 Thành tích</button><button class="btn" style="background:#26a69a" aria-label="Bật tắt âm thanh" onclick="mute=!mute;if(mute&&window.speechSynthesis)speechSynthesis.cancel();this.textContent=mute?'🔇':'🔊'">${mute?'🔇':'🔊'}</button></p>
${Array.from({length:30},(_,r)=>{const ks=CT.map((c,j)=>r*CT.length+j),all=ks.every(k=>rm(k)>0);return `<div class="card" style="background:${r%2?'#7e8fd6':'#43b0a5'};margin:10px 0;padding:10px"><div style="font-size:20px">${CI[r]} ${r<20?'Chặng '+(r+1):''} ${all?'🎖️':''}</div><div style="display:flex;gap:6px;margin-top:6px">${ks.map(k=>{const t=STEPS[k],g=G[t.gi],lk=k>0&&!ok_(k-1),cu=k==k0;return `<button ${cu?'id="cur"':''} class="btn ${lk?'lock':''}" ${lk?'disabled':''} style="flex:1;min-width:0;padding:8px 0;margin:0;font-size:26px;background:${CT.find(c=>c.id==t.c).c};${cu?'outline:5px solid #fff;animation:bn 1s infinite;':''}" onclick="go(${k})">${lk?'🔒':g.ic}<div style="font-size:13px">${rm(k)?'⭐'.repeat(rm(k)):S.sk[k]?'⏭️':'&nbsp;'}</div></button>`}).join('')}</div>${all&&(r+1)%5==0?`<p style="margin:6px 0 0"><button class="btn" style="background:#8d6e63;font-size:18px" onclick="chl(${STEPS[ks[0]].gi})">🏠 Thử thách</button><button class="btn" style="background:#5c6bc0;font-size:18px" onclick="ev(${STEPS[ks[0]].gi})">📝 Đánh giá</button></p>`:''}</div>`}).join('')}`);
const e=document.getElementById('cur');if(e&&e.scrollIntoView)setTimeout(()=>e.scrollIntoView({block:'center'}),60)}
function bdg(){lc=null;view(`<div class="row"><button class="btn" style="background:#78909c" onclick="home()">⬅️</button><b style="font-size:28px">🏅 Huy hiệu của em</b><span style="width:70px"></span></div><p class="say">Em có ${S.bd.length} / ${BD.length} huy hiệu</p>${BD.map(b=>`<div class="bg ${S.bd.includes(b[0])?'':'lock'}" onclick="say('${S.bd.includes(b[0])?b[2]:'Chơi tiếp để nhận huy hiệu này nhé'}')"><b>${b[1]}</b>${b[2]}</div>`).join('')}`)}
function rank(){lc=null;const L=[...CT].sort((a,b)=>cat(b.id)-cat(a.id)),M=['🥇','🥈','🥉'];
view(`<div class="row"><button class="btn" style="background:#78909c" onclick="home()">⬅️</button><b style="font-size:28px">🏆 Thành tích</b><span style="width:70px"></span></div>${MK(100)}<p class="say" style="font-size:26px">${rank_()}<br>⭐ ${sh(tot())} sao</p>${L.map((c,i)=>`<div class="card" style="background:${c.c};margin:10px 0;display:flex;justify-content:space-between"><span>${M[i]||'🎖️'} ${c.ic} ${c.n}</span><span>⭐ ${sh(cat(c.id))}</span></div>`).join('')}`)}
/* ===== Khung bài chơi ===== */
const hdr=t=>`<div class="row"><button class="btn" style="background:#78909c" aria-label="Quay lại" onclick="home()">⬅️</button><b style="font-size:26px">${cur.g.ic} ${CI[cur.k/CT.length|0]||''}</b><button class="btn" style="background:#26a69a" aria-label="Nghe lại" onclick="say(IN)">🔊</button></div><p class="say">${t}</p>`;
const star=m=>m==0?3:m<3?2:1;
function play(i,li,k){cur={g:G[i],i,li,k,mis:0,lock:0};try{({ang:qA,t:pz,t2:pz,tan:pz,tan2:pz,sdk:sd,xh2:pz,sdk2:sd,pt:pt,sy:sy,mm:mm,mz:mz,ord:ord,odd:odd,sim:sim})[cur.g.id]()}catch(e){view(hdr('')+'<p class="say" style="font-size:26px">Bài này đang bị lỗi 😢</p><button class="btn" style="background:#e53935;font-size:26px" onclick="skipLv()">⏭️ Bỏ qua</button>');showErr(1)}}
function dn(s){const g=cur.g;S.rm[cur.k]=Math.max(rm(cur.k),s);S.sn[g.id]=1;
const nb=BD.filter(b=>!S.bd.includes(b[0])&&b[3]());nb.forEach(b=>S.bd.push(b[0]));save();snd('win');confetti();
say('Giỏi quá! Em được '+s+' sao.'+(nb.length?' Chúc mừng em nhận huy hiệu '+nb[0][2]+'!':''));
const nx=cur.k+1<STEPS.length;
const d=document.createElement('div');d.className='ov';d.innerHTML=`<div>${MK(110)}<div style="font-size:54px">${'⭐'.repeat(s)+'☆'.repeat(3-s)}</div><div class="say" style="font-size:28px">Giỏi quá!</div>${nb.map(b=>`<div style="font-size:22px">${b[1]} Huy hiệu mới: ${b[2]}</div>`).join('')}${nx?`<button class="btn" style="background:#43a047" onclick="this.closest('.ov').remove();go(${cur.k+1})">Bài tiếp ➡️</button>`:''}<button class="btn" onclick="this.closest('.ov').remove();play(${cur.i},${cur.li},${cur.k})">🔄</button><button class="btn" style="background:#78909c" onclick="this.closest('.ov').remove();home()">🏠</button></div>`;document.body.appendChild(d)}
/* ===== Trò chơi 1: Góc vuông (đếm bằng tích vô hướng, luôn chính xác) ===== */
const SH=[[[0,0],[3,0],[3,3],[0,3]],[[0,0],[4,0],[4,2],[0,2]],[[0,0],[4,0],[0,3]],[[0,3],[4,3],[2,0]],[[2,0],[4,1.5],[2,3],[0,1.5]],[[0,0],[2,0],[4,3],[0,3]],[[0,3],[0,1],[2,0],[4,1],[4,3]],[[0,0],[1,0],[1,1],[0,1]].map(([x,y])=>[x*3,y*3])];
SH.push([[0,0],[3,0],[4,2],[1,2]],[[1,0],[3,0],[4,1.7],[3,3.4],[1,3.4],[0,1.7]],[[0,0],[4,0],[4,2],[2,3],[0,3]],[[0,0],[3,0],[3,2],[0,3]]);
const raV=p=>p.map((q,i)=>i).filter(i=>{const q=p[i],a=p[(i+p.length-1)%p.length],b=p[(i+1)%p.length],u=[a[0]-q[0],a[1]-q[1]],v=[b[0]-q[0],b[1]-q[1]];return Math.abs(u[0]*v[0]+u[1]*v[1])<1e-6*Math.hypot(...u)*Math.hypot(...v)});
function qA(){const k=Math.min(4,2+Math.floor(cur.li/3)),pool=SH.slice(0,Math.min(SH.length,4+Math.floor(cur.li*.8))),cols=Math.min(k,2),rows=Math.ceil(k/cols),CS=5.4;let mk=[],pg='';
for(let i=0;i<k;i++){const P=pool[rand(pool.length)],a=Math.random()*6.28,c=Math.cos(a),s=Math.sin(a),p=P.map(([x,y])=>[x*c-y*s,x*s+y*c]),xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),ox=(i%cols)*CS+CS/2-(Math.min(...xs)+Math.max(...xs))/2,oy=Math.floor(i/cols)*CS+CS/2-(Math.min(...ys)+Math.max(...ys))/2,q=p.map(([x,y])=>[x+ox,y+oy]);
pg+=`<polygon points="${q.join(' ')}" fill="${COL[i%6]}" stroke="#3b2f63" stroke-width=".1" stroke-linejoin="round"/>`;mk.push(...raV(q).map(j=>q[j]))}
cur.v=mk;cur.lock=0;cur.q=cur.q||0;const n=mk.length,op=shuf([n,...shuf([n-2,n-1,n+1,n+2,n+3].filter(v=>v>=0)).slice(0,3)]);
view(hdr('Có tất cả mấy góc vuông? Chọn số đúng nhé!<br><small>📐 Góc vuông giống góc của quyển vở</small>')+`<svg id="sv" viewBox="0 0 ${cols*CS} ${rows*CS}" style="width:100%;max-width:min(78vw,476px);max-height:max(min(78vw,392px),calc((100vh - 300px)*.85));background:#fff;border-radius:22px">${pg}</svg><div>${op.map(v=>`<button class="btn" style="font-size:24px;min-width:46px;padding:8px 12px;margin:5px" onclick="ansA(${v},this)">${v}</button>`).join('')}</div><p>Câu ${cur.q+1} / 2</p>`);
speak('Có tất cả mấy góc vuông? Hãy đếm rồi chọn số đúng nhé!')}
function ansA(k,b){if(cur.lock)return;if(k!=cur.v.length){cur.mis++;snd('no');b.classList.add('sh');say('Chưa đúng, em đếm lại nhé!');return}
cur.lock=1;snd('ok');say('Đúng rồi!');document.getElementById('sv').insertAdjacentHTML('beforeend',cur.v.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r=".28" fill="#e53935" opacity=".85"/>`).join(''));
cur.q++;setTimeout(()=>{if(cur.q>=2){cur.q=0;dn(star(cur.mis))}else qA()},1900)}
/* ===== Trò chơi 2 & 3: Xếp hình T và Tangram (kéo thả, chạm để xoay) ===== */
const fm=m=>[...new Set(m.join('').replace(/\./g,''))].map(ch=>{const ed={},k=(x,y)=>x+','+y,h=(a,b)=>m[b]&&m[b][a]==ch;m.forEach((r,y)=>[...r].forEach((c,x)=>{if(c!=ch)return;if(!h(x,y-1))ed[k(x,y)]=[x+1,y];if(!h(x+1,y))ed[k(x+1,y)]=[x+1,y+1];if(!h(x,y+1))ed[k(x+1,y+1)]=[x,y+1];if(!h(x-1,y))ed[k(x,y+1)]=[x,y]}));const s=Object.keys(ed)[0].split(',').map(Number),o=[];let p=s;do{o.push(p);p=ed[k(...p)]}while(p&&(p[0]!=s[0]||p[1]!=s[1])&&o.length<200);return o});
const tri=(x,y,a,t)=>({tl:[[0,0],[a,0],[0,a]],tr:[[a,0],[a,a],[0,0]],br:[[a,a],[0,a],[a,0]],bl:[[0,a],[0,0],[a,a]]}[t].map(([p,q])=>[p+x,q+y])),rc=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];

function rmm(){view(hdr('Tìm các cặp hình giống nhau!')+`<div style="display:grid;grid-template-columns:repeat(${cur.c.length>20?5:4},min(${cur.c.length>20?17:21}vw,max(56px,calc((100vh - 280px)/${Math.ceil(cur.c.length/(cur.c.length>20?5:4))})),100px));gap:8px;justify-content:center">${cur.c.map((x,i)=>{const on=cur.o.includes(i)||cur.mt.has(i);return `<div onclick="fl(${i})" style="aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:min(11vw,52px);background:${cur.mt.has(i)?'#c8e6c9':on?'#fff':'#f08c00'};box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer">${on?x:'❔'}</div>`}).join('')}</div>`)}
function fl(i){if(cur.lock||cur.o.includes(i)||cur.mt.has(i))return;cur.o.push(i);snd('pop');if(cur.o.length<2){rmm();return}cur.mv++;chkErr();const[a,b]=cur.o;
if(cur.c[a]==cur.c[b]){cur.o=[];cur.mt.add(a);cur.mt.add(b);snd('ok');rmm();if(cur.mt.size==cur.c.length){cur.lock=1;const P=cur.c.length/2;setTimeout(()=>dn(cur.mv<=P*1.6?3:cur.mv<=P*2.6?2:1),700)}return}
cur.lock=1;rmm();setTimeout(()=>{cur.o=[];cur.lock=0;rmm()},900)}
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function mz(){const n=Math.min(14,7+Math.floor(cur.li*.5)),Wl=Array.from({length:n*n},()=>[1,1,1,1]),seen=Array(n*n).fill(0),st=[0],ok=(a,b)=>a>=0&&b>=0&&a<n&&b<n;seen[0]=1;
while(st.length){const c=st[st.length-1],x=c%n,y=c/n|0,nx=shuf([0,1,2,3]).filter(d=>ok(x+DX[d],y+DY[d])&&!seen[(y+DY[d])*n+x+DX[d]]);if(!nx.length){st.pop();continue}const d=nx[0],t=(y+DY[d])*n+x+DX[d];Wl[c][d]=0;Wl[t][(d+2)%4]=0;seen[t]=1;st.push(t)}
const D=Array(n*n).fill(-1),qu=[0];D[0]=0;for(let i=0;i<qu.length;i++){const c=qu[i];for(let d=0;d<4;d++)if(!Wl[c][d]){const t=((c/n|0)+DY[d])*n+c%n+DX[d];if(D[t]<0){D[t]=D[c]+1;qu.push(t)}}}
cur.W=Wl;cur.n=n;cur.pos=0;cur.stp=0;cur.lock=0;cur.best=D[n*n-1];
const ln=Wl.map((w,c)=>{const x=c%n,y=c/n|0;return (w[0]?`M${x} ${y}h1`:'')+(w[1]?`M${x+1} ${y}v1`:'')+(w[2]?`M${x} ${y+1}h1`:'')+(w[3]?`M${x} ${y}v1`:'')}).join('');
view(hdr('Giúp khỉ đi đến quả chuối!')+`<svg viewBox="-.15 -.15 ${n+.3} ${n+.3}" style="width:100%;max-width:420px;max-height:max(min(92vw,420px),calc(100vh - 340px));background:#fff;border-radius:18px"><path d="${ln}" stroke="#3b2f63" stroke-width=".09" stroke-linecap="round" fill="none"/><text x="${n-.5}" y="${n-.5}" font-size=".7" text-anchor="middle" dominant-baseline="central">🍌</text><text id="pl" x=".5" y=".5" font-size=".7" text-anchor="middle" dominant-baseline="central">🐵</text></svg><div style="display:grid;grid-template-columns:repeat(3,76px);gap:6px;justify-content:center;margin-top:8px"><span></span><button class="btn" style="margin:0" onclick="mv(0)">⬆️</button><span></span><button class="btn" style="margin:0" onclick="mv(3)">⬅️</button><button class="btn" style="margin:0" onclick="mv(2)">⬇️</button><button class="btn" style="margin:0" onclick="mv(1)">➡️</button></div>`);
speak('Giúp chú khỉ đi đến quả chuối. Bấm các mũi tên để đi nhé!')}
function mv(d){if(cur.lock)return;if(cur.W[cur.pos][d]){snd('no');return}const n=cur.n;cur.pos=((cur.pos/n|0)+DY[d])*n+cur.pos%n+DX[d];cur.stp++;snd('pop');const p=document.getElementById('pl');p.setAttribute('x',cur.pos%n+.5);p.setAttribute('y',(cur.pos/n|0)+.5);
if(cur.pos==n*n-1){cur.lock=1;setTimeout(()=>dn(cur.stp<=cur.best+4?3:cur.stp<=cur.best*2+4?2:1),500)}}
document.addEventListener('keydown',e=>{const k={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(k!==undefined&&cur.g&&cur.g.id=='mz'){e.preventDefault();mv(k)}});
/* ===== Nhóm mới: số học, đo lường, quan sát, trí nhớ, không gian ===== */

function ord(){const li=cur.li,N=Math.min(8,4+Math.floor(li/4)),big=li>=8&&li%2==0,gp=li<6?2:1,dsc=li>=6&&li%3==1,vals=shuf([...Array(N*gp).keys()].map(x=>x+1)).slice(0,N),u=Math.floor(190/(N*gp)),w=Math.floor(88/N)-1,em=EM[rand(EM.length)];
cur.vals=vals;cur.dsc=dsc;cur.big=big;cur.used=[];cur.lock=0;
view(hdr((dsc?'🐘➡️🐜':'🐜➡️🐘')+' Chạm theo thứ tự!')+`<div style="display:flex;align-items:flex-end;justify-content:center;gap:8px;background:#fff;border-radius:20px;padding:10px;${big?'min-height:150px':'height:210px'}">${vals.map((v,i)=>big?`<div id="b${i}" onclick="tapB(${i})" style="font-size:${Math.round(18+v*(46/(N*gp)))}px;line-height:1;cursor:pointer;border-radius:12px">${em}</div>`:`<div id="b${i}" onclick="tapB(${i})" style="width:min(${w}vw,64px);height:${v*u}px;background:${COL[i%6]};border-radius:12px 12px 0 0;text-align:center;font-size:26px;color:#fff;cursor:pointer"></div>`).join('')}</div>`);speak('Chạm vào các cột theo thứ tự từ thấp nhất đến cao nhất nhé!')}
function tapB(i){if(cur.lock||cur.used.includes(i))return;const rest=cur.vals.filter((v,j)=>!cur.used.includes(j)),ex=cur.dsc?Math.max(...rest):Math.min(...rest),b=document.getElementById('b'+i);if(cur.vals[i]!=ex){cur.mis++;snd('no');b.classList.add('sh');return}cur.used.push(i);snd('ok');if(!cur.big)b.textContent='✔️';b.style.opacity=.35;if(cur.used.length==cur.vals.length){cur.lock=1;setTimeout(()=>dn(star(cur.mis)),600)}}
function tapA(i,b){if(cur.lock)return;if(i!=cur.ans){cur.mis++;snd('no');b.classList.add('sh');return}cur.lock=1;snd('ok');b.style.background='#c8e6c9';cur.q++;setTimeout(()=>{if(cur.q>=3){cur.q=0;dn(star(cur.mis))}else cur.nx()},800)}
const SP=[['🍎','🍅'],['🐶','🐺'],['🌙','🌛'],['😀','😃'],['🐱','🐯'],['⭐','🌟'],['🚗','🚙'],['🌸','🌼'],['🐸','🐢'],['🍋','🍌']];
const SP2=[['🔺','🔻'],['◀️','▶️'],['⬛','⬜'],['🔴','🟠'],['🔵','🟣'],['🕐','🕑'],['🌑','🌒'],['🟩','🟢']];
const ASY=['🚗','🐢','🐌','🦆','🐟','🐦','🦔','🚀','🐈','🐕','🚲','🦜'];
function odd(){cur.q=cur.q||0;cur.lock=0;cur.nx=odd;const li=cur.li,n=Math.min(8,4+Math.floor(li/7)),e=ASY[rand(ASY.length)],vr=['scaleX(-1)','rotate(90deg)','scaleY(-1)','scaleX(-1)'][li%4],hue=li>=22&&li%3==0,z=Math.min(Math.floor(88/n)-1,14);cur.ans=rand(n*n);
view(hdr('Tìm hình khác với các hình còn lại! Câu '+(cur.q+1)+' / 3')+`<div style="display:inline-grid;grid-template-columns:repeat(${n},min(${z}vw,max(36px,calc((100vh - 260px)/${n})),56px));gap:3px;background:#fff;padding:8px;border-radius:20px">${Array.from({length:n*n},(_,i)=>`<div onclick="tapA(${i},this)" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(${z-3}vw,34px);border-radius:8px;cursor:pointer"><span style="display:inline-block;transform:rotate(${rand(5)*5-10}deg)${i==cur.ans&&!hue?' '+vr:''};${i==cur.ans&&hue?'filter:hue-rotate(28deg)':''}">${e}</span></div>`).join('')}</div>`);speak('Tìm hình khác với các hình còn lại. Chạm vào hình đó nhé!')}
const PC=['#e53935','#1e88e5','#fdd835','#43a047','#8e24aa','#fb8c00'],PF=[262,330,392,523,440,587];
function lit(k,t){const p=document.getElementById('p'+k);if(!p)return;p.style.opacity=1;tone([[PF[k],.3,'sine']]);setTimeout(()=>p.style.opacity=.55,t||350)}
function psq(){cur.lock=1;cur.ix=0;const g=Math.round(1.32*Math.max(300,600-cur.li*10));cur.seq.forEach((k,i)=>setTimeout(()=>lit(k),g*i+300));setTimeout(()=>cur.lock=0,g*cur.seq.length+300)}
function sim(){cur.np=4;cur.seq=Array.from({length:Math.max(3,Math.round(.72*Math.min(16,4+Math.floor(cur.li*.5))))},()=>rand(cur.np));cur.ix=0;cur.lock=1;const f=cur.np==4;
view(hdr('Nhìn rồi bấm lại theo đúng thứ tự!')+`<div style="display:inline-grid;grid-template-columns:repeat(${f?2:3},min(${f?38:27}vw,${f?170:120}px));gap:12px">${PC.slice(0,cur.np).map((c,k)=>`<div id="p${k}" onclick="padt(${k})" style="aspect-ratio:1;border-radius:24px;background:${c};opacity:.55;box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer"></div>`).join('')}</div>`);speak('Nhìn và nghe các màu sáng lên, rồi bấm lại theo đúng thứ tự nhé!');setTimeout(psq,900)}
function padt(k){if(cur.lock)return;lit(k,200);if(k!=cur.seq[cur.ix]){cur.mis++;snd('no');cur.lock=1;setTimeout(psq,900);return}cur.ix++;if(cur.ix>=cur.seq.length){cur.lock=1;setTimeout(()=>dn(star(cur.mis)),500)}}

/* ===== Lộ trình: mỗi chặng có 6 bài thuộc 6 nhóm, thứ tự xáo trộn, khó dần ===== */
const STEPS=[];{const rnd=mb(2026);let prev=-1;for(let r=0;r<30;r++){let o=[...CT.keys()].map(x=>[rnd(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);if(o[0]==prev)[o[0],o[1]]=[o[1],o[0]];prev=o[o.length-1];
o.forEach(ci=>{const c=CT[ci],id=c.g[r%c.g.length],gi=G.findIndex(g=>g.id==id);STEPS.push({c:c.id,gi,li:(q=>Math.round(q+r*(G[gi].L-1-q)/29))(Math.round((G[gi].L-1)*(id=='sdk'||id=='t2'||id=='tan2'?.7:.65)))})})}}
/* ===== Nút LỖI: chỉ hiện khi sai ~20 lần (hoặc bài bị lỗi thật) để bỏ qua sang bài kế ===== */
function er(){const c=cur,id=c&&c.g&&c.g.id;if(!id)return 0;
if(id=='xh2'||id=='t2'||id=='tan2')return Math.max(0,(c.mv||0)-2*(c.P?c.P.length:0));
if(id=='sy')return Math.max(0,(c.tp||0)-(c.T?c.T.flat().filter((v,i)=>v&&!c.F.flat()[i]).length:0));
if(id=='mm')return Math.max(0,(c.mv||0)-(c.mt?c.mt.size/2:0));return c.mis||0}
function showErr(on){const b=document.getElementById('errb');if(b)b.style.display=on?'block':'none'}
function chkErr(){showErr(!!(cur&&cur.g&&!cur.lock&&er()>=20))}
function skipLv(){if(!cur||!cur.g||cur.k===undefined)return;S.sk[cur.k]=1;save();showErr(0);const nx=cur.k+1;if(nx<STEPS.length)go(nx);else home()}
if(window.addEventListener)window.addEventListener('error',()=>{if(cur&&cur.g&&!cur.lock)showErr(1)});
function go(k){const t=STEPS[k];play(t.gi,t.li,k)}
const CH={ang:'Em hãy tìm 5 đồ vật xung quanh nhà và đếm xem mỗi đồ vật có mấy góc vuông nhé!',t:'Em hãy xếp các mảnh ghép thành một đồ vật hoặc con vật em thích, rồi vẽ lại lên giấy nhé!',t2:'Em hãy xếp một ngôi nhà hoặc cối xay gió bằng các mảnh ghép, rồi vẽ lại lên giấy nhé!',tan:'Em hãy nhìn xem gạch lát sàn nhà em có hình gì. Rồi thử thiết kế một mẫu gạch của riêng em nhé!',tan2:'Em hãy thử xếp tangram thành cái ghế, cái đèn, con thỏ hay con mèo nhé!',sdk:'Em hãy tự vẽ một bảng Sudoku rồi mời ba mẹ hoặc bạn bè cùng chơi nhé!',xh2:'Em hãy tự vẽ một hình bí ẩn bằng các ô vuông, cắt thành các mảnh rồi thách ba mẹ xếp lại nhé!',sdk2:'Em hãy tự vẽ một bảng Sudoku 6 nhân 6 rồi mời ba mẹ hoặc bạn bè cùng chơi nhé!',pt:'Em hãy tự xếp một dãy đồ vật theo quy luật rồi mời ba mẹ đoán đồ vật tiếp theo nhé!',sy:'Em hãy tìm 3 vật có hai bên giống nhau như soi gương, ví dụ như cánh bướm hay chiếc lá nhé!',mm:'Em hãy cùng ba mẹ chơi trò nhớ đồ vật: nhìn 5 đồ vật, úp lại rồi nói tên thật nhiều đồ vật nhé!',mz:'Em hãy vẽ một mê cung nhỏ trên giấy rồi dẫn ba mẹ đi từ chỗ xuất phát đến đích nhé!',ord:'Em hãy xếp 5 đồ vật trong nhà từ nhỏ đến to nhé!',odd:'Em hãy cùng ba mẹ chơi trò tìm điểm khác nhau trong tranh nhé!',sim:'Em hãy cùng ba mẹ chơi vỗ tay theo nhịp, ba mẹ vỗ trước rồi em vỗ lại nhé!'};
const tbar=(t,f)=>`<div class="row"><button class="btn" style="background:#78909c" aria-label="Quay lại" onclick="home()">⬅️</button><b style="font-size:26px">${t}</b><button class="btn" style="background:#26a69a" aria-label="Nghe lại" onclick="say(IN)">🔊</button></div>`;
function chl(i){cur={i,g:G[i]};IN=CH[G[i].id]+' Sau đó, em hãy kể lại bài học hôm nay cho người thân nghe nhé!';view(tbar('🏠 Thử thách')+MK(120)+`<p class="say" style="font-size:24px">${IN}</p><button class="btn" style="background:#43a047;font-size:28px" onclick="bonus('c${G[i].id}')">✅ Em làm xong rồi!</button>`)}
function bonus(k){if(S.ch[k]){say('Em đã làm rồi, giỏi lắm!');return}S.ch[k]=1;const nb=BD.filter(b=>!S.bd.includes(b[0])&&b[3]());nb.forEach(b=>S.bd.push(b[0]));save();snd('win');confetti();say('Giỏi quá! Em được thêm một sao.'+(nb.length?' Em nhận huy hiệu '+nb[0][2]+'!':''));setTimeout(home,2600)}
function ev(i){cur={i,g:G[i],ck:[0,0,0],c:'#e53935'};IN='Hãy vẽ những gì em đã học được. Rồi chạm vào các dòng bên dưới nếu em làm được nhé.';const T=['Em hiểu bài học hôm nay.','Em nhớ những điều đã học.','Em biết dùng bài học vào cuộc sống.'];
view(tbar('📝 Đánh giá')+`<p class="say">🎨 Em hãy vẽ những gì em đã học được!</p><canvas id="cv" width="600" height="320" style="width:100%;background:#fff;border-radius:22px;touch-action:none"></canvas><div>${['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#3b2f63'].map(c=>`<button class="btn" style="background:${c};padding:14px" aria-label="Màu" onclick="cur.c='${c}';snd('pop')"></button>`).join('')}<button class="btn" style="background:#78909c" aria-label="Xóa" onclick="document.getElementById('cv').getContext('2d').clearRect(0,0,600,320)">🧽</button></div>${T.map((t,k)=>`<div class="card" id="k${k}" style="background:#26b5c9;margin:8px 0;display:flex;justify-content:space-between;font-size:20px" onclick="ck(${k})"><span onclick="event.stopPropagation();say('${t}')">🔊 ${t}</span><span>⬜</span></div>`).join('')}<button class="btn" style="background:#43a047;font-size:28px" onclick="bonus('e${G[i].id}')">⭐ Xong rồi!</button>`);
const c=document.getElementById('cv'),x=c.getContext('2d');let d=0;x.lineWidth=8;x.lineCap='round';x.lineJoin='round';const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*320/r.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);x.strokeStyle=cur.c;x.beginPath();x.moveTo(...pt(e))};c.onpointermove=e=>{if(d){x.lineTo(...pt(e));x.stroke()}};c.onpointerup=()=>d=0}
function ck(k){cur.ck[k]^=1;snd('pop');document.querySelector('#k'+k+' span:last-child').textContent=cur.ck[k]?'✅':'⬜'}
splash();
</script></body></html>
